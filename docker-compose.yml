version: '3.9'

services:
  app:
    build: .
    container_name: laitor-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://laitor:${POSTGRES_PASSWORD:-laitor123}@postgres:5432/laitor
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-laitor}
      CRM_URL: ${CRM_URL}
      CRM_API_KEY: ${CRM_API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - laitor-net

  postgres:
    image: postgres:16-alpine
    container_name: laitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laitor
      POSTGRES_USER: laitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laitor123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laitor -d laitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laitor-net

  redis:
    image: redis:7-alpine
    container_name: laitor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laitor-net

volumes:
  postgres_data:
  redis_data:

networks:
  laitor-net:
    driver: bridge
